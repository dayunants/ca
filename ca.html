<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>恭喜你 · 反诈彩蛋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 烟花画布 — 底层全屏 */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;      /* 让点击穿透，不影响按钮 */
            z-index: 0;
        }

        /* 主卡片 — 浮在烟花之上 */
        .trick-card {
            position: relative;
            z-index: 10;
            max-width: 720px;
            width: 100%;
            background: rgba(10, 14, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 100, 0.25);
            border-radius: 3.5rem;
            padding: 3rem 2.5rem 3.2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 200, 80, 0.1) inset;
            text-align: center;
            transition: all 0.2s ease;
            animation: cardGlow 3s infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255, 200, 80, 0.1) inset; }
            100% { box-shadow: 0 30px 80px rgba(255, 180, 50, 0.2), 0 0 0 2px rgba(255, 200, 80, 0.25) inset; }
        }

        /* 主标题 — 被骗了 */
        .main-headline {
            font-size: clamp(2.6rem, 10vw, 4.6rem);
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #ffe484;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.6), 0 4px 20px rgba(255, 100, 0, 0.3);
            margin-bottom: 0.75rem;
            word-break: break-word;
            line-height: 1.2;
        }

        .sub-emojii {
            font-size: clamp(2rem, 6vw, 3.6rem);
            display: block;
            margin-top: -0.2rem;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.3));
        }

        .divider-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffb347, #ffe484, #ffb347, transparent);
            margin: 1.2rem auto 1.8rem;
            border-radius: 10px;
            opacity: 0.7;
        }

        /* 中间小字描述 */
        .desc-text {
            font-size: clamp(1rem, 2.8vw, 1.4rem);
            color: rgba(255, 235, 200, 0.9);
            background: rgba(0, 0, 0, 0.3);
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 100, 0.15);
            margin-bottom: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        /* 点此了解更多 — 按钮样式 (就像真实链接) */
        .fake-link-btn {
            display: inline-block;
            background: rgba(255, 215, 100, 0.08);
            border: 1.5px solid rgba(255, 215, 100, 0.4);
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 600;
            color: #ffd966;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(255, 200, 50, 0.08);
            letter-spacing: 0.06em;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .fake-link-btn:hover {
            background: rgba(255, 215, 100, 0.18);
            border-color: #ffd966;
            box-shadow: 0 0 30px rgba(255, 200, 50, 0.25);
            transform: scale(1.02);
            color: #ffe48a;
        }

        .fake-link-btn:active {
            transform: scale(0.97);
            background: rgba(255, 200, 50, 0.25);
        }

        /* 底部小字 — 反诈提示 */
        .footnote {
            margin-top: 2.8rem;
            font-size: 0.8rem;
            color: rgba(255, 200, 150, 0.3);
            letter-spacing: 0.08em;
            border-top: 1px solid rgba(255, 200, 100, 0.06);
            padding-top: 1.8rem;
            font-weight: 300;
        }

        .footnote a {
            color: rgba(255, 200, 150, 0.35);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 200, 100, 0.1);
        }

        .footnote a:hover {
            color: rgba(255, 200, 150, 0.6);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .trick-card {
                padding: 2.5rem 1.2rem 2.8rem;
                border-radius: 2.5rem;
            }
            .desc-text {
                padding: 0.5rem 1.2rem;
                font-size: 0.95rem;
            }
            .fake-link-btn {
                padding: 0.7rem 2rem;
                font-size: 1.1rem;
                width: 100%;
                max-width: 280px;
            }
        }

        /* 针对老设备 */
        @media (prefers-reduced-motion: reduce) {
            #fireworks-canvas {
                display: none;
            }
            .trick-card {
                background: rgba(10, 14, 30, 0.95);
            }
        }
    </style>
</head>
<body>

    <!-- 烟花渲染层 -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- 主卡片：恭喜被骗 + 反诈链接 -->
    <div class="trick-card">
        <span class="sub-emojii">🎆🎇</span>
        <h1 class="main-headline">恭喜你被我骗到了</h1>
        <div class="divider-line"></div>
        <div class="desc-text">⚠️ 谨防诈骗 · 网络世界多核实</div>

        <!-- “点此了解更多” 跳转至 国家反诈中心 百度百科 -->
        <a href="https://baike.baidu.com/item/%E5%9B%BD%E5%AE%B6%E5%8F%8D%E8%AF%88%E4%B8%AD%E5%BF%83/55975989" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="fake-link-btn">
           🔗 点此了解更多
        </a>

        <div class="footnote">
            <span>🐜 蚁友 · 反诈彩蛋</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ---------- 烟花引擎 (轻量绚烂) ----------
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // 粒子池
            let particles = [];
            const MAX_PARTICLES = 500;

            // 颜色库 (暖色/金色/红/橙/白)
            const colorPalette = [
                '#FFD966', '#FFB347', '#FF8C42', '#FF5E5E', 
                '#FFB3B3', '#FFDAB9', '#FADADD', '#FFE484',
                '#FFAA66', '#FF9966', '#FFCC80', '#FFB74D',
                '#FFA07A', '#F4A460', '#FFD700', '#FFA500'
            ];

            // 随机工具
            function random(min, max) {
                return Math.random() * (max - min) + min;
            }

            function randomInt(min, max) {
                return Math.floor(random(min, max + 1));
            }

            function pick(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // 粒子类
            class Particle {
                constructor(x, y, color, vx, vy, radius, life, gravity = 0.06, fade = 0.98) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.life = life;
                    this.maxLife = life;
                    this.gravity = gravity;
                    this.fade = fade;
                    this.alpha = 1;
                    this.trail = [];
                    this.maxTrail = 3;
                }

                update() {
                    // 记录轨迹
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.maxTrail) {
                        this.trail.shift();
                    }

                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;

                    this.life -= 1;
                    this.alpha = Math.min(1, (this.life / this.maxLife) * 1.2);
                    // 半径随生命衰减
                    this.radius *= 0.998;
                    if (this.radius < 0.3) this.radius = 0.3;
                }

                draw(ctx) {
                    // 拖尾光晕
                    for (let i = 0; i < this.trail.length; i++) {
                        const t = this.trail[i];
                        const alphaTrail = (i / this.trail.length) * this.alpha * 0.35;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, this.radius * (i / this.trail.length) * 0.6, 0, Math.PI * 2);
                        ctx.fillStyle = this.color.replace(')', `,${alphaTrail})`).replace('rgb', 'rgba');
                        if (!this.color.startsWith('rgba')) {
                            // 如果颜色不是rgba，转一下
                            ctx.fillStyle = hexToRgba(this.color, alphaTrail);
                        } else {
                            ctx.fillStyle = this.color;
                        }
                        ctx.fill();
                    }

                    // 主粒子
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.2, 0, Math.PI * 2);
                    const mainAlpha = this.alpha * 0.95;
                    ctx.fillStyle = hexToRgba(this.color, mainAlpha);
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    // 重置阴影避免影响其他绘制
                    ctx.shadowBlur = 0;

                    // 高光
                    ctx.beginPath();
                    ctx.arc(this.x - this.radius * 0.2, this.y - this.radius * 0.2, this.radius * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fill();
                }

                isDead() {
                    return this.life <= 0 || this.radius < 0.2 || this.alpha < 0.02;
                }
            }

            // 辅助: 将hex转为rgba字符串
            function hexToRgba(hex, alpha) {
                let r = 255, g = 255, b = 255;
                if (hex.startsWith('#')) {
                    const raw = hex.slice(1);
                    if (raw.length === 3) {
                        r = parseInt(raw[0] + raw[0], 16);
                        g = parseInt(raw[1] + raw[1], 16);
                        b = parseInt(raw[2] + raw[2], 16);
                    } else if (raw.length === 6) {
                        r = parseInt(raw.slice(0,2), 16);
                        g = parseInt(raw.slice(2,4), 16);
                        b = parseInt(raw.slice(4,6), 16);
                    }
                }
                return `rgba(${r},${g},${b},${Math.min(1, alpha)})`;
            }

            // 生成一次烟花 (从底部爆发)
            function createFirework() {
                const x = random(width * 0.1, width * 0.9);
                const y = random(height * 0.15, height * 0.5);
                const color = pick(colorPalette);
                const count = randomInt(50, 100);
                const angleSpread = Math.PI * 2;
                const speed = random(3, 9);

                for (let i = 0; i < count; i++) {
                    const angle = random(0, angleSpread);
                    const vel = random(1.5, speed);
                    const vx = Math.cos(angle) * vel * random(0.7, 1.3);
                    const vy = Math.sin(angle) * vel * random(0.7, 1.3) - random(0.5, 2);
                    const radius = random(1.2, 3.8);
                    const life = randomInt(45, 90);
                    const gravity = random(0.02, 0.08);
                    particles.push(new Particle(x, y, color, vx, vy, radius, life, gravity));
                }

                // 少量白色小粒增加闪耀
                for (let i = 0; i < 12; i++) {
                    const angle = random(0, Math.PI * 2);
                    const vel = random(2, 6);
                    const vx = Math.cos(angle) * vel * random(0.5, 1.2);
                    const vy = Math.sin(angle) * vel * random(0.5, 1.2) - random(0, 2);
                    const radius = random(0.8, 2);
                    const life = randomInt(20, 50);
                    particles.push(new Particle(x, y, '#FFFFFF', vx, vy, radius, life, 0.02, 0.97));
                }
            }

            // 循环生成烟花
            let fireworkInterval = 0;

            function animate() {
                // 半透明覆盖形成拖尾
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(10, 14, 30, 0.25)';
                ctx.fillRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'lighter';

                // 更新 & 绘制粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    if (p.isDead()) {
                        particles.splice(i, 1);
                        continue;
                    }
                    p.draw(ctx);
                }

                // 限制粒子数量
                if (particles.length > MAX_PARTICLES) {
                    particles.splice(0, particles.length - MAX_PARTICLES);
                }

                // 定时生成烟花 (每帧概率 + 间隔)
                if (particles.length < 280 && Math.random() < 0.08) {
                    createFirework();
                }

                // 偶尔双响
                if (particles.length < 150 && Math.random() < 0.03) {
                    setTimeout(() => createFirework(), 60);
                }

                requestAnimationFrame(animate);
            }

            // 初始绽放 (进入页面立刻来几发)
            function initialBurst() {
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        createFirework();
                        if (i % 2 === 0) {
                            setTimeout(() => createFirework(), 200);
                        }
                    }, i * 280);
                }
                // 后续持续
                setTimeout(() => {
                    const interval = setInterval(() => {
                        if (particles.length < 200) {
                            createFirework();
                            if (Math.random() > 0.6) createFirework();
                        }
                    }, 900);
                    // 不清理interval，让烟花持续伴随
                }, 1200);
            }

            // 兼容性：如果浏览器不支持lighter，降级
            try {
                ctx.globalCompositeOperation = 'lighter';
            } catch (e) {
                // 忽略
            }

            // 启动
            animate();
            initialBurst();

            // 窗口改变重新适应
            window.addEventListener('resize', () => {
                resize();
            });

            // 点击页面任意位置增加烟花互动 (不干扰链接点击)
            document.addEventListener('click', function(e) {
                // 但如果点击的是链接或者按钮，不额外生成太多，让链接正常工作
                const target = e.target.closest('a, .fake-link-btn, button');
                if (target) return;
                // 非交互区域点击增加烟花
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => createFirework(), i * 100);
                }
            });

            // 触摸设备也支持
            document.addEventListener('touchstart', function(e) {
                const target = e.target.closest('a, .fake-link-btn, button');
                if (target) return;
                for (let i = 0; i < 2; i++) {
                    setTimeout(() => createFirework(), i * 120);
                }
            }, { passive: true });

            console.log('🎇 烟花已绽放 · 反诈彩蛋 loaded');
        })();
    </script>
</body>
</html>
